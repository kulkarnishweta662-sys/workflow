<!DOCTYPE html>
<html>
    <head>
        <title> Employee Task Manager </title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class = "Employee"> 
        <h1> 3. Add Employee </h1>
        <label> Name: </label>
        <input type = "text" placeholder = "Enter your name"> <br>

        <label> Email: </label>
        <input type = "text" placeholder = "Enter your Email"> <br>

        <label> Role: </label>
        <input type = "text" placeholder = "Enter your Role"> <br>

        <button type = "submit"> Add Employee </button>
        </div>

        <div class = "task">
        <h1> 4. Add Task </h1>
        <label> Task title: </label>
        <input type = "text" placeholder = "Title of the Task"> <br>

        <label> Description: </label>
        <textarea = "text" placeholder = "Describe your task"> </textarea> 
        <button type = "submit"> Add Task </button>
        </div>
    </body>
</html>
